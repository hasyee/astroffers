<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="%DESCRIPTION%" />
    <!-- one URL for the main view, whatever date and place the query holds -->
    <link rel="canonical" href="https://astroffers.hasyee.com/" />
    <!-- the preview of a shared link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Astroffers" />
    <meta property="og:title" content="Astroffers" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="https://astroffers.hasyee.com/" />
    <meta property="og:image" content="https://astroffers.hasyee.com/icons/icon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Astroffers",
        "url": "https://astroffers.hasyee.com/",
        "description": "%DESCRIPTION%",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "author": { "@type": "Person", "name": "Péter Hauszknecht", "url": "https://github.com/hasyee" }
      }
    </script>
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#000000" />
    <title>Astroffers</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- the red light mode (src/redlight/, index.scss): everything below in gray, then multiplied by dim red -->
    <div class="red-light-gray" aria-hidden="true"></div>
    <div class="red-light-tint" aria-hidden="true"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
