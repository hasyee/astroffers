services:
  - name: astroffers
    type: web
    runtime: static
    branch: master
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - astroffers.hasyee.com
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - vite.config.ts
        - tsconfig*.json
        - package.json
        - package-lock.json
    headers:
      # the service worker must always be revalidated, or a PWA update would never reach installed clients
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      # client-side routes (/calendar, /objects/:ngc, ...) are served by the app; existing files are served as they are
      - type: rewrite
        source: /*
        destination: /index.html
